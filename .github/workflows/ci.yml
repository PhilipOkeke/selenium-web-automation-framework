name: Selenium Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out browser framework
        uses: actions/checkout@v6

      - name: Check out TaskFlow API
        uses: actions/checkout@v6
        with:
          repository: SenseiPhiL/taskflow-api
          path: system-under-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install framework and API
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./system-under-test

      - name: Check code quality
        run: |
          ruff check .
          ruff format --check .

      - name: Start TaskFlow services
        env:
          DATABASE_URL: sqlite:///./ci-taskflow.db
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/taskflow-api.log 2>&1 &
          python scripts/serve_web_app.py > /tmp/taskflow-web.log 2>&1 &
          python scripts/wait_for_services.py

      - name: Run headless Chrome tests
        env:
          BROWSER: chrome
          HEADLESS: "true"
        run: |
          pytest \
            --html=reports/selenium-report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml

      - name: Collect service logs
        if: always()
        run: |
          cp /tmp/taskflow-api.log reports/ 2>/dev/null || true
          cp /tmp/taskflow-web.log reports/ 2>/dev/null || true

      - name: Upload reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-test-artifacts
          path: |
            reports/
            screenshots/
          if-no-files-found: warn
