[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-web-automation"
version = "1.0.0"
description = "A Selenium WebDriver test automation framework for the TaskFlow web application."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Philip Okeke", email = "Engr.philipokeke@gmail.com" },
]
dependencies = [
  "requests==2.34.2",
  "selenium==4.48.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-html==4.2.0",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=taskflow_web_automation --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "smoke: critical browser checks for fast feedback",
  "regression: complete browser workflow coverage",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
