<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="TaskFlow task management dashboard">
    <title>TaskFlow Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="TaskFlow home">
        <span class="brand-mark" aria-hidden="true">TF</span>
        <span>TaskFlow</span>
      </a>
      <div id="api-status" class="status-badge" role="status">Connecting…</div>
    </header>

    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Task management</p>
          <h1 id="page-title">Plan work. Track progress.</h1>
          <p class="hero-copy">A simple dashboard connected to the TaskFlow REST API.</p>
        </div>
        <div class="task-total" aria-label="Visible task count">
          <span id="task-count">0</span>
          <small>visible tasks</small>
        </div>
      </section>

      <section class="panel create-panel" aria-labelledby="create-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">New work item</p>
            <h2 id="create-heading">Create a task</h2>
          </div>
        </div>

        <form id="task-form" class="task-form">
          <label class="field field-title" for="task-title">
            <span>Title</span>
            <input id="task-title" name="title" type="text" minlength="3" maxlength="120" required placeholder="e.g. Review checkout endpoint">
          </label>

          <label class="field field-description" for="task-description">
            <span>Description</span>
            <input id="task-description" name="description" type="text" maxlength="1000" placeholder="Add useful context">
          </label>

          <label class="field field-priority" for="task-priority">
            <span>Priority</span>
            <select id="task-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>

          <button class="primary-button" type="submit">Add task</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="tasks-heading">
        <div class="section-heading task-heading-row">
          <div>
            <p class="eyebrow">Current workload</p>
            <h2 id="tasks-heading">Tasks</h2>
          </div>

          <div class="filters" aria-label="Task filters">
            <label class="search-field" for="search-input">
              <span class="visually-hidden">Search tasks</span>
              <input id="search-input" type="search" placeholder="Search tasks">
            </label>

            <label for="status-filter">
              <span class="visually-hidden">Filter by status</span>
              <select id="status-filter">
                <option value="">All statuses</option>
                <option value="todo">To do</option>
                <option value="in_progress">In progress</option>
                <option value="done">Done</option>
              </select>
            </label>

            <label for="priority-filter">
              <span class="visually-hidden">Filter by priority</span>
              <select id="priority-filter">
                <option value="">All priorities</option>
                <option value="low">Low priority</option>
                <option value="medium">Medium priority</option>
                <option value="high">High priority</option>
              </select>
            </label>
          </div>
        </div>

        <div id="task-list" class="task-list" aria-live="polite" aria-busy="true"></div>

        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">✓</div>
          <h3>No tasks found</h3>
          <p>Create a task or adjust the filters to see work here.</p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
